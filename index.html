<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diecast Pasta Tuned</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: Arial, sans-serif; 
      background: #0a0a0a; 
      color: #ffffff; 
      text-align: center;
    }
    header {
      background: linear-gradient(135deg, #1a0000, #330000, #1a1a1a);
      padding: 60px 20px;
    }
    .logo { 
      width: 220px; 
      margin-bottom: 20px; 
      filter: drop-shadow(0 0 20px #ff00aa);
    }
    h1 { 
      font-size: 3em; 
      color: #ff00aa; 
      text-shadow: 0 0 25px #ff00aa;
      margin-bottom: 8px;
    }
    .subtitle { 
      font-size: 1.5em; 
      color: #ffcc00; 
      text-shadow: 0 0 15px #ffcc00;
    }
    .section {
      padding: 50px 20px;
    }
    h2 {
      color: #ff00aa;
      margin-bottom: 30px;
      text-shadow: 0 0 15px #ff00aa;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }
    .gallery-item {
      width: 320px;
    }
    .gallery img {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(255, 0, 170, 0.4);
      transition: all 0.3s;
    }
    .gallery img:hover {
      transform: scale(1.08);
      box-shadow: 0 15px 40px rgba(255, 0, 170, 0.6);
    }
    .caption {
      margin-top: 12px;
      font-size: 1.05em;
      color: #ffcc00;
    }
    a {
      color: #ffcc00;
      text-decoration: none;
    }
    a:hover { color: white; }
  </style>
</head>
<body>
  <header>
    <img src="logo.PNG" alt="Diecast Pasta Tuned Logo" class="logo">
    <h1>Diecast Pasta Tuned</h1>
    <p class="subtitle">CarTuned Diecast Showcase</p>
  </header>

  <div class="section">
    <h2>CarTuned Collection</h2>
    <div class="gallery">
      <div class="gallery-item">
        <img src="CarTuned-JDM-Series 3-2022 Toyota GR86-blue-orange.jpg" alt="2022 Toyota GR86">
        <p class="caption">2022 Toyota GR86 • Blue Orange</p>
      </div>
      <div class="gallery-item">
        <img src="CarTuned-Lowrider BLVD-Series 2-1947 Chevy Fleetline.jpg" alt="1947 Chevy Fleetline">
        <p class="caption">1947 Chevy Fleetline • Lowrider</p>
      </div>
      <!-- Add more photos here in the same format -->
    </div>
  </div>

  <div class="section">
    <h2>Watch on YouTube</h2>
    <p>
      <a href="https://youtube.com/@diecastpastatuned" target="_blank">→ Diecast Pasta Tuned YouTube Channel</a>
    </p>
  </div>
</body>
</html>
