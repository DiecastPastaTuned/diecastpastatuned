<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diecast Pasta Tuned</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: Arial, sans-serif; 
      background: #0a0a0a; 
      color: #ffffff; 
      text-align: center;
    }
    header {
      background: linear-gradient(135deg, #1a0000, #330000, #1a1a1a);
      padding: 60px 20px;
    }
    .logo { 
      width: 220px; 
      margin-bottom: 20px; 
      filter: drop-shadow(0 0 15px #ff00aa);
    }
    h1 { 
      font-size: 3em; 
      color: #ff00aa; 
      text-shadow: 0 0 20px #ff00aa;
    }
    .subtitle { 
      font-size: 1.5em; 
      color: #ffcc00; 
      text-shadow: 0 0 10px #ffcc00;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      padding: 40px 20px;
    }
    .gallery img {
      width: 320px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(255, 0, 170, 0.3);
      transition: transform 0.3s;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.PNG" alt="Diecast Pasta Tuned Logo" class="logo">
    <h1>Diecast Pasta Tuned</h1>
    <p class="subtitle">CarTuned Diecast Showcase</p>
  </header>

  <div class="section" style="padding: 50px 20px;">
    <h2>CarTuned Collection</h2>
    <div class="gallery">
      <img src="CarTuned-JDM-Series 3-2022 Toyota GR86-blue-orange.jpg" alt="2022 Toyota GR86">
      <img src="CarTuned-Lowrider BLVD-Series 2-1947 Chevy Fleetline.jpg" alt="1947 Chevy Fleetline">
      <img src="CarTuned-Muscle Cars HWY-Series 1-1963 Chevy Corvette-yellow-black.jpg" alt="1963 Chevy Corvette">
      <img src="CarTuned-JDM-Series 1-1993 Toyota Supra-orange-green.jpg" alt="1993 Toyota Supra">
      <img src="CarTuned-JDM-Series 3-1993 Toyota A90 Supra-red.jpg" alt="1993 Toyota A90 Supra">
      <img src="CarTuned-Walgreens exclusive-Lowrider BLVD-Series 3-1957 GMC Panel Van-red.jpg" alt="1957 GMC Panel Van">
      <img src="CarTuned-JDM-Series 3-2022 Toyota GR86-green-black.jpg" alt="2022 Toyota GR86">
      <img src="CarTuned-Lowriders-Series 1-1963 Chevy Impala.jpg" alt="1963 Chevy Impala">
      <img src="CarTuned-JDM-Series 1-2022 Toyota GR Supra-purple-flower deco.jpg" alt="2022 Toyota GR Supra">
      <img src="CarTuned-JDM-Series 3-1983 Toyota Supra-purple blue two tone.jpg" alt="1983 Toyota Supra">
      <img src="CarTuned-Lowriders-Series 1-1964 Chevy Impala.jpg" alt="1964 Chevy Impala">
      <img src="CarTuned-Walgreens exclusive-Customs PKWY-1956 Chevy Nomad-Series 2-brown-gold.jpg" alt="1956 Chevy Nomad">
    </div>
  </div>

  <div class="section">
    <h2>Watch on YouTube</h2>
    <p>
      <a href="https://youtube.com/@diecastpastatuned" target="_blank">→ Diecast Pasta Tuned YouTube Channel</a>
    </p>
  </div>
</body>
</html>
